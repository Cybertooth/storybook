steps:
  # 1. Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/storybook-backend:$COMMIT_SHA', '-f', 'backend/Dockerfile', './backend']

  # 2. Build Frontend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/storybook-frontend:$COMMIT_SHA', '-f', 'web-ui/Dockerfile', '.']

  # 3. Push Backend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/storybook-backend:$COMMIT_SHA']

  # 4. Push Frontend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/storybook-frontend:$COMMIT_SHA']

  # 5. Apply database and backend to GKE
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'apply'
      - '-f'
      - 'k8s/postgres-statefulset.yaml'
      - '-f'
      - 'k8s/backend-deployment.yaml'
      - '-f'
      - 'k8s/backend-service.yaml'
      - '-f'
      - 'k8s/frontend-deployment.yaml'
      - '-f'
      - 'k8s/frontend-service.yaml'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=$_COMPUTE_ZONE'
      - 'CLOUDSDK_CONTAINER_CLUSTER=$_CLUSTER_NAME'

  # 6. Set image tags to the newly built versions in GKE
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'set'
      - 'image'
      - 'deployment/storybook-backend'
      - 'storybook-backend=gcr.io/$PROJECT_ID/storybook-backend:$COMMIT_SHA'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=$_COMPUTE_ZONE'
      - 'CLOUDSDK_CONTAINER_CLUSTER=$_CLUSTER_NAME'

  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'set'
      - 'image'
      - 'deployment/storybook-frontend'
      - 'storybook-frontend=gcr.io/$PROJECT_ID/storybook-frontend:$COMMIT_SHA'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=$_COMPUTE_ZONE'
      - 'CLOUDSDK_CONTAINER_CLUSTER=$_CLUSTER_NAME'

images:
  - 'gcr.io/$PROJECT_ID/storybook-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/storybook-frontend:$COMMIT_SHA'
