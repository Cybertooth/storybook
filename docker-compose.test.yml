version: '3.8'

services:
  db-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: storybook_test
      POSTGRES_PASSWORD: password_test
      POSTGRES_DB: storybook_test
    ports:
      - "5433:5432"

  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    environment:
      DATABASE_URL: "postgresql://storybook_test:password_test@db-test:5432/storybook_test"
      JWT_SECRET: "test-secret"
      MOCK_LLM: "true"
    ports:
      - "3001:3000"
    depends_on:
      - db-test
    command: ["/bin/sh", "-c", "cd backend && sleep 5 && npx prisma db push --accept-data-loss && npm run test:e2e -- --forceExit"]

  web-ui-test:
    build:
      context: .
      dockerfile: web-ui/Dockerfile
    environment:
      VITE_API_BASE_URL: "http://backend-test:3000/api/v1"
    ports:
      - "8081:80"
    depends_on:
      - backend-test
